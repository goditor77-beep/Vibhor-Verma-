<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer Cyber Target Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-dasharray="24 16" opacity="0.6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4"/>

  <!-- Target Crosshairs -->
  <line x1="256" y1="46" x2="256" y2="86" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="426" x2="256" y2="466" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <line x1="46" y1="256" x2="86" y2="256" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <line x1="426" y1="256" x2="466" y2="256" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

  <!-- Center Shield/Core -->
  <polygon points="256,120 360,180 360,320 256,390 152,320 152,180" fill="#090d16" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Typography: IIT 2027 -->
  <text x="256" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="78" fill="#ffffff" text-anchor="middle" letter-spacing="4">IIT</text>
  <text x="256" y="305" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="40" fill="#38bdf8" text-anchor="middle" letter-spacing="6">2027</text>
  <text x="256" y="345" font-family="monospace" font-weight="700" font-size="18" fill="#a5f3fc" text-anchor="middle" letter-spacing="3">COMMAND</text>
</svg>
